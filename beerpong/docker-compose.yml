services:
  redis:
    image: redis:7-alpine
    container_name: bp-redis
    restart: unless-stopped

  backend:
    build: ./django_backend
    container_name: bp-backend
    ports:
      - "8000:8000"
    volumes:
      - ./django_backend:/app
    environment:
      - SECRET_KEY=change-me-in-production
      - DEBUG=True
      - REDIS_HOST=redis
      - ALLOWED_HOSTS=*
    depends_on:
      - redis
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: bp-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE=
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped
